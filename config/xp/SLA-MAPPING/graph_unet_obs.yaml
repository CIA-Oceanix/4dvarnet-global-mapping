# @package _global_

#needs torch-geometric  
xpname: glo12-sla-4th-graphunet96-GCNConv-global-obs-ossev2-noiseg+u03-timeemb

ckpt: null

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: false
  deterministic: true
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1
  logger:
    _target_: pytorch_lightning.loggers.tensorboard.TensorBoardLogger
    save_dir: ${hydra:runtime.output_dir}
    name: ${hydra:runtime.choices.xp}
    version: ''
  max_epochs: 2000
  limit_train_batches: 100
  callbacks:
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_loss
    save_last: true
    save_top_k: 3
    filename: '{val_loss:.5f}-{epoch:03d}'
  check_val_every_n_epoch: 25 #3
  accumulate_grad_batches: 1

datamodule:
  #same datamodule as for unet_obs
  _target_: contrib.glorys12.DistinctNormDataModulewInputTracks
  input_da:
    _target_: contrib.glorys12.load_glorys12_data_on_fly_inp
    tgt_path: /Odyssey/public/glorys/reanalysis/glorys12_2010_2019_daily_sla_4th_gridded_from_alongtrack.nc
    inp_path: /Odyssey/public/glorys/reanalysis/glorys12_2010_2019_daily_sla_4th_gridded_from_alongtrack.nc
    inp_var: obs
    tgt_var: tgt
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2010-01-01', '2017-12-31']}
    val:
      time: {_target_: builtins.slice, _args_: ['2018-01-01', '2018-12-31']}
    test: null
  xrds_kw:
    train:
      patch_dims: {time: 15, lat: 256, lon: 256} #{time: 15, lat: 256, lon: 256}
      strides: {time: 1,lat: 196,lon: 154}   # {time: 1,lat: 196,lon: 154}
      domain_limits: ${domain.train}
      noise: 0.03
      noise_type: gaussian+uniforms
    val:
      patch_dims: {time: 15, lat: 512, lon: 512} #{time: 15, lat: 512, lon: 512}
      strides: {time: 1,lat: 136,lon: 488}   # {time: 1,lat: 136,lon: 488}
      domain_limits: ${domain.train}
      noise: 0.03
      noise_type: gaussian+uniform
  dl_kw: {batch_size: 4, num_workers: 12}
  norm_stats:
    train:
    - -0.001930378327255099
    - 0.08604745118775728
    val:
    - 0.01560162689028551
    - 0.08583080433051968

model:
  _target_: contrib.4dvarnet_latent.models.Lit4dVarNetIgnoreNaN
  w_mse: 50.
  w_grad_mse: 1000.
  w_prior: 1.
  persist_rw: false
  no_prior: true
  opt_fn:
    _target_: contrib.4dvarnet_latent.models.cosanneal_lr_adam_base
    _partial_: true
    lr: 0.0001
    T_max: ${trainer.max_epochs}
  rec_weight:
    _target_: ocean4dvarnet.utils.get_triang_time_wei
    patch_dims: ${datamodule.xrds_kw.train.patch_dims}
    crop: {time: 0, lat: 4, lon: 4}
  val_rec_weight:
    _target_: ocean4dvarnet.utils.get_triang_time_wei
    patch_dims: ${datamodule.xrds_kw.val.patch_dims}
    crop: {time: 0, lat: 4, lon: 4}
  norm_stats: ${datamodule.norm_stats}
  w_mse_lr: 0.
  w_grad_mse_lr: 0
  osse_with_interp_error: false
  solver:
    _target_: contrib.graph_unet.models_res.GraphUNetDirectSolver
    in_channels: 15
    out_channels: 15
    hidden_channels: 384
    depth: 3
    pool_ratios: 0.5
    dropout: 0.1
    act: silu # relu
    sum_res: false
    time_embed_dim: 384

entrypoints:
  - _target_: pytorch_lightning.seed_everything
    seed: 333
  - _target_: contrib.glorys12.train
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}
    ckpt: ${ckpt}

defaults:
  - /domain: glorys
  - _self_
