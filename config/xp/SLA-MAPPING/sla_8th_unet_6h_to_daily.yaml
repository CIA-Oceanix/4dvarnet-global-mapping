# @package _global_

xpname: sla-8th-unet-6h-to-daily
ckpt: null

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: false
  deterministic: true
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1
  logger:
    _target_: pytorch_lightning.loggers.tensorboard.TensorBoardLogger
    save_dir: ${hydra:runtime.output_dir}
    name: ${hydra:runtime.choices.xp}
    version: ''
  max_epochs: 2000
  limit_train_batches: 100
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 5
  callbacks:
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_loss
      save_last: true
      save_top_k: 3
      filename: '{val_loss:.5f}-{epoch:03d}'

datamodule:
  _target_: contrib.unet_daily_output.DailyTargetDataModule
  input_da:
    _target_: contrib.unet_daily_output.load_daily_targets
    tgt_path: /Odyssey/public/glorys/reanalysis/glorys12_2010_2019_daily_sla_8th_gridded_from_alongtrack_float32.nc
    inp_path: /Odyssey/private/p23leflo/data/glorys8th_6h_linear_v2/glorys12_2010_2019_6h_linear.nc
    tgt_var: tgt
    inp_var: obs
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2010-01-01', '2017-12-31']}
    val:
      time: {_target_: builtins.slice, _args_: ['2018-01-01', '2018-12-31']}
    test: null
  xrds_kw:
    train:
      patch_dims: {time: 60, lat: 512, lon: 512}
      strides: {time: 4, lat: 392, lon: 308}
      domain_limits: ${domain.train}
      noise: 0.03
      noise_type: gaussian+uniform
    val:
      patch_dims: {time: 60, lat: 512, lon: 512}
      strides: {time: 60, lat: 136, lon: 488}
      domain_limits: ${domain.train}
      noise: 0.03
      noise_type: gaussian+uniform
  dl_kw: {batch_size: 4, num_workers: 4}
  norm_stats:
    train: [-5.786314326822401e-06, 0.04420528872326667]
    val: [-5.786314326822401e-06, 0.04420528872326667]

model:
  _target_: contrib.4dvarnet_latent.models.Lit4dVarNetIgnoreNaN
  w_mse: 50.
  w_grad_mse: 1000.
  w_prior: 1.
  persist_rw: false
  no_prior: true
  opt_fn:
    _target_: contrib.4dvarnet_latent.models.cosanneal_lr_adam_base
    _partial_: true
    lr: 0.0001
    T_max: ${trainer.max_epochs}
  rec_weight:
    _target_: ocean4dvarnet.utils.get_triang_time_wei
    patch_dims: {time: 15, lat: 512, lon: 512}
    crop: {time: 0, lat: 4, lon: 4}
  val_rec_weight:
    _target_: ocean4dvarnet.utils.get_triang_time_wei
    patch_dims: {time: 15, lat: 512, lon: 512}
    crop: {time: 0, lat: 4, lon: 4}
  norm_stats: ${datamodule.norm_stats}
  w_mse_lr: 0.
  w_grad_mse_lr: 0
  osse_with_interp_error: false
  solver:
    _target_: contrib.4dvarnet_latent.unet.UNetModel2
    dims: 2
    in_channels: 60
    out_channels: 15
    model_channels: 94
    num_res_blocks: 3
    channel_mult: [1, 2, 4]
    attention_resolutions: []
    use_checkpoint: true
    dropout: 0.1
    bias: false
    interp_mode: bilinear

entrypoints:
  - _target_: pytorch_lightning.seed_everything
    seed: 333
  - _target_: contrib.glorys12.train
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}
    ckpt: ${ckpt}

defaults:
  - /domain: glorys
  - _self_
